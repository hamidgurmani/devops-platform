grafana:
  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: "2GB"
    storageSpec: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate: null
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

defaultRules:
  create: true
