name: DevOps Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Application and Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python application
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build -t devops-platform:${{ github.sha }} ./app

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.1

      - name: Lint Helm chart
        run: helm lint ./helm/devops-platform

      - name: Validate Helm templates
        run: helm template devops-platform ./helm/devops-platform
